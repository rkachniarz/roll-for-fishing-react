<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14232b">
  <meta name="description" content="A pixel-art fishing game: watch the bobber, strike when it splashes, and roll a d20 to land the catch.">
  <title>Roll for Fishing</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="./styles.css">

  <!-- Pinned here rather than in each module, so there's one place to change a
       version (docs/decisions.md, D2). -->
  <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.mjs"
    }
  }
  </script>
</head>
<body data-phase="loading">

<main class="layout">
  <div class="scene-wrap" id="sceneWrap">
    <canvas id="scene" aria-label="The lake, seen from the shore"></canvas>
    <div id="buffBar" hidden></div>
  </div>

  <!-- Until the owner's layout sketch (DEV_PLAN Q-38): a plain panel. -->
  <section class="panel">
    <h1>Roll for Fishing</h1>
    <p class="who" id="who"></p>
    <p class="where" id="where"></p>
    <p class="status" id="status" aria-live="polite">Loading the lake…</p>
    <div class="result" id="result" hidden></div>
    <ol class="log" id="log"></ol>
    <p class="notice" id="notice" hidden></p>
    <div class="buttons">
      <button type="button" class="quiet" id="bags" aria-expanded="false"></button>
      <button type="button" class="quiet" id="newGame"></button>
    </div>
    <div class="inventory" id="inventory" hidden></div>

    <details class="dev" id="devPanel" hidden>
      <summary>Dev bench</summary>
      <div id="devBench"></div>
    </details>
  </section>
</main>

<dialog class="create release" id="release">
  <h2 id="releaseTitle"></h2>
  <p id="releaseText"></p>
  <div class="release-list" id="releaseList"></div>
</dialog>

<dialog class="create" id="create">
  <form method="dialog" id="createForm">
    <h2 id="createTitle"></h2>
    <label class="field"><span id="createNameLabel"></span>
      <span class="row"><input id="createName" maxlength="24" required autocomplete="off">
      <button type="button" id="createRerollName"></button></span>
    </label>
    <fieldset class="field"><legend id="createGenderLabel"></legend><div class="choices" id="createGender"></div></fieldset>
    <fieldset class="field"><legend id="createClassLabel"></legend><div class="choices classes" id="createClass"></div></fieldset>
    <fieldset class="field"><legend id="createStatsLabel"></legend>
      <div class="stats-grid" id="createStats"></div>
      <button type="button" id="createRerollStats"></button>
    </fieldset>
    <button type="submit" class="primary" id="createStart"></button>
  </form>
</dialog>

<script type="module" src="./src/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14232b">
  <meta name="description" content="A pixel-art fishing game: watch the bobber, strike when it splashes, and roll a d20 to land the catch.">
  <title>Roll for Fishing</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <!-- The theme before anything draws, so a light page doesn't flash dark
       (src/settings.js keeps the same key). -->
  <script>
    try {
      const theme = JSON.parse(localStorage.getItem('roll-for-fishing:settings') || '{}').theme;
      if (theme) document.documentElement.dataset.theme = theme;
    } catch {}
  </script>

  <!-- Pinned here rather than in each module, so there's one place to change a
       version (docs/decisions.md, D2). -->
  <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.mjs"
    }
  }
  </script>
</head>
<body data-phase="loading">

<main class="layout">
  <!-- On a phone, room above the scene the height of the button row, so the
       scene sits lower and easier on the eye (D94). Empty for now. -->
  <div class="top-spacer" aria-hidden="true"></div>
  <div class="scene-wrap" id="sceneWrap">
    <canvas id="scene" aria-label="The lake, seen from the shore"></canvas>
    <div id="buffBar" hidden></div>
    <!-- The panes open over the scene, WoW style (docs/spec.md, R16.4). -->
    <section class="pane" id="pane" hidden aria-labelledby="paneTitle">
      <header class="pane-head">
        <h2 id="paneTitle"></h2>
        <button type="button" class="pane-close" id="paneClose">×</button>
      </header>
      <div class="pane-body" id="paneBody"></div>
    </section>
    <!-- What the player can't do, in red, as WoW's error frame (D83). -->
    <div class="errors" id="errors" aria-live="assertive"></div>
  </div>

  <!-- The owner's phone sketch (D79): the button row, then the log. -->
  <div class="hud">
    <div class="xp" id="xp"><div class="xp-fill" id="xpFill"></div></div>
    <nav class="bar">
      <button type="button" class="bar-button" id="player" data-pane="player"></button>
      <div class="world" id="world">
        <button type="button" class="weather" id="weather"></button>
        <p><span id="timeOfDay"></span><br><span id="seasonDay"></span></p>
      </div>
      <button type="button" class="bar-button" id="journal" data-pane="journal"></button>
      <button type="button" class="bar-button" id="map" data-pane="map"></button>
      <button type="button" class="bar-button" id="bucket" data-pane="bucket"></button>
      <button type="button" class="bar-button" id="bag" data-pane="bag"></button>
    </nav>
    <div class="log-frame">
      <div class="log" id="log" role="log" aria-live="polite"></div>
      <!-- The bag opens over the log, beside whatever pane is over the scene,
           so items can be dragged between it and the character's slots (D83). -->
      <section class="pane bag-pane" id="bagPane" hidden aria-labelledby="bagTitle" data-drop="bag:pane">
        <header class="pane-head">
          <h2 id="bagTitle"></h2>
          <button type="button" class="pane-close" id="bagClose">×</button>
        </header>
        <div class="pane-body" id="bagBody"></div>
      </section>
      <button type="button" class="bar-button menu" id="menu" data-pane="menu"></button>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </div>
</main>

<dialog class="create title" id="title">
  <h1 id="titleName"></h1>
  <p id="titlePrompt"></p>
  <div class="menu-list" id="titleMenu"></div>
</dialog>

<dialog class="create release" id="release">
  <h2 id="releaseTitle"></h2>
  <p id="releaseText"></p>
  <div class="release-list" id="releaseList"></div>
</dialog>

<dialog class="create event" id="event" aria-labelledby="eventTitle">
  <h2 id="eventTitle"></h2>
  <div class="event-art" id="eventArt" hidden></div>
  <div class="event-text" id="eventText"></div>
  <div class="event-choices" id="eventChoices"></div>
</dialog>

<dialog class="create" id="create">
  <form method="dialog" id="createForm">
    <h2 id="createTitle"></h2>
    <label class="field"><span id="createNameLabel"></span>
      <span class="row"><input id="createName" maxlength="24" required autocomplete="off">
      <button type="button" id="createRerollName"></button></span>
    </label>
    <fieldset class="field"><legend id="createGenderLabel"></legend><div class="choices" id="createGender"></div></fieldset>
    <fieldset class="field"><legend id="createClassLabel"></legend><div class="choices classes" id="createClass"></div></fieldset>
    <fieldset class="field"><legend id="createStatsLabel"></legend>
      <div class="stats-grid" id="createStats"></div>
      <button type="button" id="createRerollStats"></button>
    </fieldset>
    <button type="submit" class="primary" id="createStart"></button>
  </form>
</dialog>

<script type="module" src="./src/main.js"></script>
</body>
</html>
